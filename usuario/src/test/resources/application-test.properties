spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
```create-drop` asegurará que la base de datos se vacíe y se cree de nuevo para cada ejecución del contexto de prueba, cumpliendo el requisito.

# Configuración de log para el perfil de pruebas
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.jpa=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.ventas.usuario=DEBUG

spring.jackson.serialization.indent-output=true
spring.hateoas.use-hal-as-default-json-media-type=true