# Configuración de base de datos H2 para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de HATEOAS
spring.hateoas.use-hal-as-default-json-media-type=true
spring.hateoas.enabled=false

# Configuración de seguridad para pruebas
spring.security.user.name=test
spring.security.user.password=test
spring.security.user.roles=USER

# Configuración de logging para pruebas
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.ventas.usuario=TRACE

# Configuración de Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.fail-on-empty-beans=false

# Deshabilitar validación Hibernate para pruebas
spring.jpa.properties.javax.persistence.validation.mode=none

