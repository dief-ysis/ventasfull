plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0' 
    id 'io.spring.dependency-management' version '1.1.6' 
}

group = 'ventas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) 
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral() 
}

dependencies {
    // Spring Boot Starter Data JPA 
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring Boot Starter Web 
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Lombok 
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring HATEOAS (¡NUEVO! para la implementación de HATEOAS)
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'

    // Springdoc OpenAPI (¡NUEVO! para la documentación Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Driver de PostgreSQL (para la conexión a NeonDB)
    runtimeOnly 'org.postgresql:postgresql'
    // Base de datos H2 (¡NUEVO! para tests en memoria)
    runtimeOnly 'com.h2database:h2'

    // Spring Boot Starter Test (para pruebas, incluye JUnit, Mockito y AssertJ)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // DataFaker (¡NUEVO! para generar datos de prueba en los tests)
    testImplementation 'net.datafaker:datafaker:2.2.2' // Revisa la última versión
    // Mockito (generalmente ya incluido con spring-boot-starter-test, pero si necesitas una versión específica)
    testImplementation 'org.mockito:mockito-core'
    implementation 'net.datafaker:datafaker:2.0.2'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('compileJava') {
    options.compilerArgs.add('-parameters') // Incluye nombres de parámetros en el bytecode
}